apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-ai-copilot-settings
spec:
  forms:
    - group: basic
      label: AI设置
      formSchema:

        - $formkit: select
          name: globalAiType
          label: 全局AI类型
          placeholder: "选择默认使用的AI提供商"
          options:
            - label: OpenAI
              value: "openAi"
            - label: 智谱AI
              value: "zhipuAi"
            - label: 通义千问
              value: "dashScope"
            - label: Codesphere
              value: "codesphere"
            - label: 硅基流动
              value: "siliconFlow"
            - label: DeepSeek
              value: "deepSeek"
          value: "deepSeek"
          help: "设置全局默认的AI提供商，推荐使用 DeepSeek"
        - $formkit: group
          name: aiModelConfig
          label: AI模型配置
          help: 说明：配置AI模型提供商和相关参数
          value:
            openAiConfig:
              apiKey: ""
              modelName: "gpt-4o"
              baseUrl: "https://api.openai.com/"
            zhipuAiConfig:
              apiKey: ""
              modelName: "glm-4"
            dashScopeConfig:
              apiKey: ""
              modelName: "qwen-max"
            codesphereConfig:
              apiKey: ""
              modelName: "zhipu-free"
            deepSeekConfig:
              apiKey: ""
              modelName: "deepseek-chat"
          children:
            - $formkit: group
              name: deepSeekConfig
              label: DeepSeek 配置（推荐）
              help: "配置DeepSeek AI模型参数"
              children:
                - $formkit: password
                  name: apiKey
                  label: DeepSeek API密钥
                  placeholder: "请输入DeepSeek的API Key"
                  help: "必填，请前往DeepSeek官网获取API Key"
                - $el: div
                  attrs:
                    class: "formkit-help text-xs text-gray-500"
                  innerHTML: "国内AI服务商 <a href='https://platform.deepseek.com/' title='前往DeepSeek获取API Key' target='_blank' class='text-blue-500 hover:text-blue-700'>DeepSeek 注册并获取API Key</a>，性价比高，支持多种模型。"
                - $formkit: select
                  name: modelName
                  label: DeepSeek 模型名称
                  searchable: true
                  allowCreate: true
                  placeholder: "请选择或输入模型名称"
                  options:
                    - label: deepseek-chat
                      value: deepseek-chat
                    - label: deepseek-coder
                      value: deepseek-coder
                    - label: deepseek-reasoner
                      value: deepseek-reasoner
                  help: "选择或自定义DeepSeek模型名称"
            - $formkit: group
              name: openAiConfig
              label: OpenAI 配置
              help: "配置OpenAI模型参数"
              children:
                - $formkit: password
                  name: apiKey
                  label: OpenAI API密钥
                  placeholder: "请输入OpenAI的API Key"
                  help: "必填，请前往 OpenAI 官网获取 API Key"
                - $formkit: select
                  name: modelName
                  label: 模型名称
                  searchable: true
                  allowCreate: true
                  placeholder: "请选择或输入模型名称"
                  options:
                    - label: gpt-4o
                      value: gpt-4o
                    - label: gpt-4o-mini
                      value: gpt-4o-mini
                  help: "选择或自定义模型名称"
                - $formkit: text
                  name: baseUrl
                  label: API地址
                  placeholder: "https://api.openai.com/"
                  help: "只需填写基础API地址，系统会自动拼接端点路径"

            - $formkit: group
              name: zhipuAiConfig
              label: 智谱AI 配置
              help: "配置智谱AI模型参数"
              children:
                - $formkit: password
                  name: apiKey
                  label: 智谱AI API密钥
                  placeholder: "请输入智谱AI的API Key"
                  help: "必填，请前往智谱AI官网获取API Key"
                - $formkit: select
                  name: modelName
                  label: 智谱AI 模型名称
                  searchable: true
                  allowCreate: true
                  placeholder: "请选择或输入模型名称"
                  options:
                    - label: GLM-4.5
                      value: GLM-4.5
                  help: "选择或自定义智谱模型名称"

            - $formkit: group
              name: dashScopeConfig
              label: 通义千问 配置
              help: "配置通义千问模型参数"
              children:
                - $formkit: password
                  name: apiKey
                  label: 通义千问 API密钥
                  placeholder: "请输入通义千问的API Key"
                  help: "必填，请前往阿里云获取通义千问API Key"
                - $formkit: select
                  name: modelName
                  label: 通义千问 模型名称
                  searchable: true
                  allowCreate: true
                  placeholder: "请选择或输入模型名称"
                  options:
                    - label: qwen-max
                      value: qwen-max
                  help: "选择或自定义通义千问模型名称"
            - $formkit: group
              name: codesphereConfig
              label: Codesphere 配置
              help: "配置Codesphere加速站参数"
              children:
                - $formkit: password
                  name: apiKey
                  label: Codesphere API密钥
                  placeholder: "请输入Codesphere API Key"
                  help: "国内加速站，更快的响应速度"
                - $formkit: select
                  name: modelName
                  label: Codesphere 模型类型
                  searchable: true
                  allowCreate: true
                  placeholder: "请选择或输入模型类型"
                  options:
                    - label: glm-4-flash
                      value: glm-4-flash
                  help: "推荐免费的智谱推理模型"

            - $formkit: group
              name: siliconFlowConfig
              label: 硅基流动 配置
              help: "配置硅基流动AI模型参数"
              children:
                - $formkit: password
                  name: apiKey
                  label: 硅基流动 API密钥
                  placeholder: "请输入硅基流动的API Key"
                  help: "必填，请前往硅基流动官网获取API Key"
                - $formkit: select
                  name: modelName
                  label: 硅基流动 模型名称
                  searchable: true
                  allowCreate: true
                  placeholder: "请选择或输入模型名称"
                  options:
                    - label: deepseek-ai/DeepSeek-V2.5
                      value: deepseek-ai/DeepSeek-V2.5
                  help: "选择或自定义硅基流动模型名称"
                - $formkit: text
                  name: baseUrl
                  label: API地址
                  placeholder: "https://api.siliconflow.cn"
                  help: "硅基流动API地址，使用默认地址即可"
                  value: "https://api.siliconflow.cn"

    - group: generate
      label: 补全设置
      formSchema:
        - $formkit: select
          name: generateAiType
          label: 补全AI类型选择
          placeholder: "选择用于文章补全的AI提供商"
          options:
            - label: 使用主配置AI
              value: ""
            - label: OpenAI
              value: "openAi"
            - label: 智谱AI
              value: "zhipuAi"
            - label: 通义千问
              value: "dashScope"
            - label: Codesphere
              value: "codesphere"
            - label: 硅基流动
              value: "siliconFlow"
            - label: DeepSeek
              value: "deepSeek"
          help: "选择专门用于文章补全的AI提供商，留空则使用主配置"
          value: ""
        - $formkit: textarea
          name: generateSystemPrompt
          label: 补全角色设定 (System Prompt)
          placeholder: "请输入文章补全的AI角色设定"
          value: ""
          help: "自定义补全的 System Prompt，留空则使用内置的'强制续写'优化提示词（推荐留空）。"
        - $formkit: number
          name: generateMaxToken
          label: 单次补全最大长度
          placeholder: "请输入最大生成字符数"
          value: 100
          min: 10
          max: 1000
          help: "限制AI单次生成的最大Token数量，防止生成过长内容。默认100。"